
<div class="quiz-header">
    <h1><i class="fas fa-graduation-cap"></i> 清云·考培在线 <small style="font-size: 0.8em; opacity: 0.8;">(武汉研发中心内测)</small></h1>
    <div class="subtitle">请仔细阅读题目，选择正确答案</div>
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
</div>

<div class="quiz-content">
    {{ content |safe }}
</div>

<div id="score-display" class="score-card">
    <div class="score-number" id="score-number">0%</div>
    <div class="score-text">
        <i class="fas fa-trophy"></i>
        <span id="score-text">您的得分</span>
    </div>
    <div style="margin-top: 1rem; font-size: 1rem;">
        <span id="correct-count">0</span> / <span id="total-count">0</span> 题正确
    </div>
</div>

<div class="quiz-actions">
    <button id="check-questions" class="btn btn-quiz btn-check">
        <i class="fas fa-check-circle"></i> 提交答案
    </button>
    <button id="reset-questions" class="btn btn-quiz btn-reset">
        <i class="fas fa-redo"></i> 重新开始
    </button>
</div>

<script type="text/javascript">{{ javascript |safe }}</script>
